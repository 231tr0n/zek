---
name: Lint
on:
  workflow_dispatch:
  workflow_call:
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Fedora container: same shellcheck/shfmt packages as Fedora dev systems,
    # so CI and local runs agree. dockerfmt/prettier fetch latest on demand.
    container: fedora:latest
    timeout-minutes: 15
    steps:
      - name: Install lint tools
        run: |
          set -euo pipefail
          dnf install -y git shellcheck shfmt nodejs npm golang
          go install github.com/reteps/dockerfmt@latest
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Print tool versions
        run: |
          shellcheck --version | sed -n '2p'
          npx --yes prettier --version
          dockerfmt version
          command -v shfmt
      - name: Lint
        run: ./lint.sh
