---
{
  name: "Lint",
  "on": {
    workflow_dispatch: ,
    workflow_call: ,
  },
  # Workflow-level defaults: pin bash for every run: block (the fedora
  # container below would otherwise use `sh -e`; on ubuntu GitHub already
  # runs `bash -eo pipefail`) and keep the default token scope read-only
  # for jobs that do not ask for more.
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    lint: {
      runs-on: "ubuntu-latest",
      # Fedora container: same shellcheck/shfmt packages as Fedora dev systems,
      # so CI and local runs agree. Pinned by major (not :latest) so the
      # toolchain cannot drift overnight; bump via Dependabot. The go tools
      # below are pinned for the same reason (Dependabot cannot see them).
      # prettier resolves via npx (pinned in lint.sh); yamlfmt
      # (sigs.k8s.io/yaml) formats the repo YAML files and lints the
      # inline heredoc configs; actionlint checks this workflow plus the
      # shell of every run: block.
      container: "fedora:45",
      timeout-minutes: 15,
      steps: [{
        name: "Install lint tools",
        run: "\
           set -euo pipefail\n\
           dnf install -y git shellcheck shfmt nodejs npm golang haproxy\n\
           go install github.com/reteps/dockerfmt@v0.5.4\n\
           go install sigs.k8s.io/yaml/yamlfmt@v1.6.0\n\
           go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12\n\
           echo \"$(go env GOPATH)/bin\" >>\"$GITHUB_PATH\"\n\
          ",
      }, {
        name: "Allow git in container",
        run: "git config --global --add safe.directory '*'",
      }, {
        uses: "actions/checkout@v7",
      }, {
        name: "Print tool versions",
        run: "\
           set -euo pipefail\n\
           shellcheck --version | sed -n '2p'\n\
           npx --yes prettier --version\n\
           dockerfmt version\n\
           command -v shfmt\n\
           yamlfmt -h | sed -n '1p'\n\
           actionlint --version | sed -n '1p'\n\
           haproxy -v | sed -n '1p'\n\
          ",
      }, {
        name: "Lint",
        run: "./lint.sh",
      }],
    },
  },
}
