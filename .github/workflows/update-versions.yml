---
{
  name: "Update versions",
  "on": {
    workflow_dispatch: ,
    schedule: [{
      cron: "0 0 * * *",
    }],
  },
  # Static group serializes daily runs on purpose (no
  # cancel-in-progress): a version bump must not supersede another.
  concurrency: {
    group: "update-versions",
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only; the create-pr job below asks for the write scopes
  # it needs on top (job-level permissions replace this default
  # entirely).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    lint: {
      # Same linter as CI, run before spending any e2e compute on a change
      # that would not pass lint anyway (e2e needs this job below).
      uses: "./.github/workflows/lint.yml",
    },
    prepare: {
      # Resolve the new pins once, apply them, and share the updated
      # Makefile with everything downstream: the e2e jobs test exactly
      # these pins and the PR publishes exactly what was tested.
      runs-on: "ubuntu-latest",
      timeout-minutes: 15,
      outputs: {
        alpine: "${{ steps.latest.outputs.alpine }}",
        alpine_prev: "${{ steps.latest.outputs.alpine_prev }}",
        k8s: "${{ steps.latest.outputs.k8s }}",
        k8s_prev: "${{ steps.latest.outputs.k8s_prev }}",
      },
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Print versions",
        run: "\
           git --version\n\
           docker --version\n\
          ",
      }, {
        name: "Resolve latest versions",
        id: "latest",
        run: "\
           set -euo pipefail\n\
           command -v yq >/dev/null 2>&1 || { echo \"yq is required (preinstalled on ubuntu-latest runners)\" >&2; exit 1; }\n\
           alpine=$(curl -fsSL --retry 5 --retry-all-errors \\\n\
          \  https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml |\n\
          \  yq -r '.[0].version')\n\
           k8s=$(curl -fsSL --retry 5 --retry-all-errors https://dl.k8s.io/release/stable.txt)\n\
           echo \"$alpine\" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+$' || { echo \"unexpected alpine version: $alpine\"; exit 1; }\n\
           echo \"$k8s\" | grep -Eq '^v[0-9]+\\.[0-9]+\\.[0-9]+$' || { echo \"unexpected kubernetes version: $k8s\"; exit 1; }\n\
           alpine_prev=$(sed -nE 's/^ALPINE_VERSION[[:space:]]*\\?=[[:space:]]*//p' Makefile)\n\
           k8s_prev=$(sed -nE 's/^KUBERNETES_VERSION[[:space:]]*\\?=[[:space:]]*//p' Makefile)\n\
          \  echo \"$alpine_prev\" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+$' || { echo \"unexpected alpine_prev: $alpine_prev\"; exit 1; }\n\
          \  echo \"$k8s_prev\" | grep -Eq '^v[0-9]+\\.[0-9]+\\.[0-9]+$' || { echo \"unexpected k8s_prev: $k8s_prev\"; exit 1; }\n\
           {\n\
          \  echo \"alpine=$alpine\"\n\
          \  echo \"k8s=$k8s\"\n\
          \  echo \"alpine_prev=$alpine_prev\"\n\
          \  echo \"k8s_prev=$k8s_prev\"\n\
           } >>\"$GITHUB_OUTPUT\"\n\
           echo \"alpine: $alpine_prev -> $alpine\"\n\
           echo \"kubernetes: $k8s_prev -> $k8s\"\n\
          ",
      }, {
        name: "Update pins",
        if: "steps.latest.outputs.alpine != steps.latest.outputs.alpine_prev || steps.latest.outputs.k8s != steps.latest.outputs.k8s_prev",
        env: {
          ALPINE: "${{ steps.latest.outputs.alpine }}",
          K8S: "${{ steps.latest.outputs.k8s }}",
        },
        run: "\
           set -euo pipefail\n\
           sed -i -E 's|^(ALPINE_VERSION[[:space:]]*\\?=[[:space:]]*).*|\\1'\"${ALPINE}\"'|' Makefile\n\
           sed -i -E 's|^(KUBERNETES_VERSION[[:space:]]*\\?=[[:space:]]*).*|\\1'\"${K8S}\"'|' Makefile\n\
          ",
      }, {
        # Always shared (even when the pins did not change): e2e always
        # fetches this artifact via the makefile-artifact input
        # (build-and-test.yml), so a conditional upload would break the
        # no-op run. The name must stay "updated-makefile" on both sides.
        name: "Share updated Makefile",
        uses: "actions/upload-artifact@v7",
        with: {
          name: "updated-makefile",
          path: "Makefile",
          retention-days: 7,
        },
      }],
    },
    e2e: {
      needs: [
        "lint",
        "prepare",
      ],
      uses: "./.github/workflows/build-and-test.yml",
      with: {
        makefile-artifact: "updated-makefile",
      },
    },
    create-pr: {
      # Both needs are intentional: e2e implies prepare, but the PR body
      # below reads needs.prepare.outputs.* directly.
      needs: [
        "prepare",
        "e2e",
      ],
      permissions: {
        contents: "write",
        pull-requests: "write",
      },
      runs-on: "ubuntu-latest",
      timeout-minutes: 15,
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Fetch updated Makefile",
        uses: "actions/download-artifact@v8",
        with: {
          name: "updated-makefile",
        },
      }, {
        name: "Count git status",
        id: "git-status",
        # set -euo pipefail: without it a failing `git status` (index
        # locked, shallow clone gone wrong) would be masked by wc -l's
        # success, report 0 files and silently skip the PR.
        run: "\
           set -euo pipefail\n\
           files=$(git status --porcelain | wc -l)\n\
           echo \"files=${files}\" >>\"$GITHUB_OUTPUT\"\n\
          ",
      }, {
        name: "Create pull request",
        if: "steps.git-status.outputs.files != '0'",
        env: {
          GH_TOKEN: "${{ github.token }}",
        },
        run: "\
           set -euo pipefail\n\
           # Commit the artifact Makefile on the bot branch and push it;\n\
           # an open PR for the branch is then already refreshed by the\n\
           # push, so only create one when no open PR exists yet.\n\
           # 41898282 is github-actions[bot]'s GitHub user id, which keeps\n\
           # the noreply address stable if the bot name is ever reused.\n\
           branch=update-versions\n\
           git config user.name \"github-actions[bot]\"\n\
           git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\
           git switch -C \"${branch}\"\n\
           git add Makefile\n\
           git commit -m \"chore: update alpine/k8s versions\"\n\
           # --force-with-lease: refuse to clobber a branch tip that\n\
           # moved since this run fetched it (plain --force would not).\n\
           git push --force-with-lease -u origin \"${branch}\"\n\
           # Capture the query: an gh failure inside [[ -n $(...) ]]\n\
           # would be swallowed as an empty answer and create a\n\
           # duplicate PR on top of an existing one.\n\
           if ! pr=$(gh pr list --base main --head \"${branch}\" --state open \\\n\
           --json number --jq '.[0].number // empty'); then\n\
           echo \"could not query open PRs for ${branch}\" >&2\n\
           exit 1\n\
           fi\n\
           if [[ -n ${pr} ]]; then\n\
           echo \"open pull request already exists for ${branch}\"\n\
           exit 0\n\
           fi\n\
           # Quoted heredoc: the body is literal text (backticks and all);\n\
           # the pin placeholders are substituted by the runner before this\n\
           # script runs and are version strings validated in prepare.\n\
           cat >pr-body.md <<'EOF'\n\
           Daily version bump. `./lint.sh`, `make build` and `./e2e.sh` passed with the new pins.\n\
           \n\
           | Pin                | before                                   | after                               |\n\
           | ------------------ | ---------------------------------------- | ----------------------------------- |\n\
           | ALPINE_VERSION     | ${{ needs.prepare.outputs.alpine_prev }} | ${{ needs.prepare.outputs.alpine }} |\n\
           | KUBERNETES_VERSION | ${{ needs.prepare.outputs.k8s_prev }}    | ${{ needs.prepare.outputs.k8s }}    |\n\
           \n\
           Before merging, check the release-coupled spots listed in README.md\n\
           (\"Upgrading Kubernetes\"): the kubeadm init/join CLI flags and the\n\
           kubelet `--cgroup-driver` flag in `entrypoint.sh`, plus the soft\n\
           couplings (kube-proxy conntrack keys, containerd bin_dirs/unpack_config).\n\
           EOF\n\
           gh pr create --base main --head \"${branch}\" \\\n\
          \  --title \"chore: update alpine/k8s versions\" --body-file pr-body.md\n\
          ",
      }],
    },
  },
}
