---
{
  name: "Build and test",
  "on": {
    workflow_call: {
      inputs: {
        makefile-artifact: {
          description: "Name of an artifact holding the updated Makefile to test instead of the checked-out one",
          type: "string",
          default: "",
        },
      },
    },
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only (this workflow only checks out, builds and tests).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    build_and_test: {
      runs-on: "ubuntu-latest",
      timeout-minutes: 90,
      strategy: {
        fail-fast: false,
        matrix: {
          # Same list as ALL_TESTS in e2e.sh, spelled out so each job is
          # named after its test. One test per runner: two clusters sharing
          # the 4 vCPU/16GB runner starve kubelet, so no job ever runs two.
          test: [
            "single-node",
            "multi-master",
            "multi-worker",
            "flannel",
            "cilium",
            "smoke",
            "persistence",
            "recovery",
          ],
        },
      },
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Print versions",
        run: "\
           git --version\n\
           docker --version\n\
          ",
      }, {
        name: "Fetch updated Makefile",
        if: "${{ inputs['makefile-artifact'] != '' }}",
        uses: "actions/download-artifact@v8",
        with: {
          name: "${{ inputs['makefile-artifact'] }}",
        },
      }, {
        name: "Build image",
        run: "\
           set -euo pipefail\n\
           export IMAGE=\"ghcr.io/${GITHUB_REPOSITORY,,}\"\n\
           echo \"IMAGE=${IMAGE}\" >>\"$GITHUB_ENV\"\n\
           make build\n\
          ",
      }, {
        name: "Install jq",
        run: "sudo apt-get update && sudo apt-get install -y jq",
      }, {
        name: "Run e2e tests",
        run: "\
           set -euo pipefail\n\
           ZEK_IMAGE=\"${IMAGE}:latest\" ./e2e.sh \"${{ matrix.test }}\"\n\
          ",
      }],
    },
  },
}
