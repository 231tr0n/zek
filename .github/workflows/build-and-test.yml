---
{
  name: "Build and test",
  "on": {
    workflow_call: {
      inputs: {
        makefile-artifact: {
          description: "Name of an artifact holding the updated Makefile to test instead of the checked-out one",
          type: "string",
          default: "",
        },
      },
    },
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only (this workflow only checks out, builds and tests).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    build_and_test: {
      runs-on: "ubuntu-latest",
      timeout-minutes: 90,
      strategy: {
        fail-fast: false,
        matrix: {
          # Same list as ALL_TESTS in e2e.sh, spelled out so each job is
          # named after its test. One test per runner: two clusters sharing
          # the 4 vCPU/16GB runner starve kubelet, so no job ever runs two.
          test: [
            "single-node",
            "multi-master",
            "multi-worker",
            "flannel",
            "cilium",
            "smoke-1",
            "smoke-2",
            "smoke-3",
            "smoke-4",
            "smoke-5",
            "persistence-1",
            "persistence-2",
            "recovery-1",
            "recovery-2",
          ],
        },
      },
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Print versions",
        run: "\
           git --version\n\
           docker --version\n\
          ",
      }, {
        name: "Fetch updated Makefile",
        if: "${{ inputs['makefile-artifact'] != '' }}",
        uses: "actions/download-artifact@v8",
        with: {
          name: "${{ inputs['makefile-artifact'] }}",
        },
      }, {
        name: "Build image",
        run: "./.github/scripts/build-image.sh",
      }, {
        name: "Run e2e tests",
        # Hard budget per matrix entry. smoke/persistence/recovery are
        # split so each entry finishes well inside five minutes.
        # multi-master stays a single entry: its 3+1 bring-up is most of
        # the cost and every additional entry would repeat it, so
        # splitting multiplies the runtime instead of shortening it. Its
        # aborted-create/LB-reuse check uses that same bring-up, but the
        # HA checks still put the entry around six minutes. cilium is
        # likewise unsplit - its install is dominated by pulling CNI
        # images from quay.io, which no split can shorten. The image build
        # above is a separate step; only the job's 90-minute timeout
        # bounds it.
        timeout-minutes: "${{ matrix.test == 'multi-master' && 10 || matrix.test == 'cilium' && 10 || 5 }}",
        run: "\
           set -euo pipefail\n\
           ZEK_IMAGE=\"${IMAGE}:latest\" ./e2e.sh \"${{ matrix.test }}\"\n\
          ",
      }],
    },
  },
}
