---
{
  name: "Push CI",
  "on": {
    push: {
      branches: [
        "main",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only; the push job below asks for the packages write it
  # needs on top (job-level permissions replace this default entirely).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    lint: {
      uses: "./.github/workflows/lint.yml",
    },
    build_and_test: {
      needs: "lint",
      uses: "./.github/workflows/build-and-test.yml",
    },
    push: {
      # Publish only once every test job passed; rebuilds the same
      # commit, so the pushed image is what the tests just validated.
      needs: "build_and_test",
      permissions: {
        contents: "read",
        packages: "write",
      },
      runs-on: "ubuntu-latest",
      timeout-minutes: 30,
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Build image",
        run: "\
           set -euo pipefail\n\
           export IMAGE=\"ghcr.io/${GITHUB_REPOSITORY,,}\"\n\
           echo \"IMAGE=${IMAGE}\" >>\"$GITHUB_ENV\"\n\
           make build\n\
          ",
      }, {
        name: "Log in to GHCR",
        uses: "docker/login-action@v4",
        with: {
          registry: "ghcr.io",
          username: "${{ github.actor }}",
          password: "${{ secrets.GITHUB_TOKEN }}",
        },
      }, {
        name: "Push image",
        run: "\
           set -euo pipefail\n\
           docker push --all-tags \"${IMAGE}\"\n\
          ",
      }],
    },
  },
}
