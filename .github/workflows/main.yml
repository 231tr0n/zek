---
{
  name: "Push CI",
  "on": {
    push: {
      branches: [
        "main",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only; the push job below asks for the packages write it
  # needs on top (job-level permissions replace this default entirely).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    ci: {
      uses: "./.github/workflows/ci.yml",
    },
    push: {
      # Publish only when the image content inputs changed (Dockerfile,
      # entrypoint.sh or Makefile) and e2e was required; image inputs are
      # a subset of e2e inputs, and `needs: ci` ensures the tests passed.
      # Rebuilds the same commit, so the pushed image is what the tests
      # validated. Without an image change there is nothing new to publish.
      needs: "ci",
      if: "needs.ci.outputs.image == 'true' && needs.ci.outputs.e2e == 'true'",
      permissions: {
        contents: "read",
        packages: "write",
      },
      runs-on: "ubuntu-latest",
      timeout-minutes: 30,
      steps: [{
        uses: "actions/checkout@v7",
      }, {
        name: "Build image",
        run: "./.github/scripts/build-image.sh",
      }, {
        name: "Log in to GHCR",
        uses: "docker/login-action@v4",
        with: {
          registry: "ghcr.io",
          username: "${{ github.actor }}",
          password: "${{ secrets.GITHUB_TOKEN }}",
        },
      }, {
        name: "Push image",
        run: "\
           set -euo pipefail\n\
           docker push --all-tags \"${IMAGE}\"\n\
          ",
      }],
    },
  },
}
