---
name: Push CI
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
  build_and_push:
    needs: lint
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Print versions
        run: |
          git --version
          docker --version
      - name: Build image
        run: |
          set -euo pipefail
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="$image" make build
      - name: Run e2e tests
        # No arguments: every test in e2e.sh's ALL_TESTS runs, two at a
        # time (ZEK_E2E_JOBS default): the runner has 4 vCPU/16GB - more
        # parallel clusters risk OOM and kubeadm's hard 4m deadline.
        run: |
          set -euo pipefail
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ZEK_IMAGE="$image:latest" ./e2e.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          set -euo pipefail
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker push --all-tags "$image"
