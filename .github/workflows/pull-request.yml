---
{
  name: "Pull Request CI",
  "on": {
    pull_request: {
      branches: [
        "main",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.event.pull_request.number }}",
    cancel-in-progress: true,
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only (both jobs only check out, lint and test).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    lint: {
      uses: "./.github/workflows/lint.yml",
    },
    build_and_test: {
      needs: "lint",
      uses: "./.github/workflows/build-and-test.yml",
    },
  },
}
