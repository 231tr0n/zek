---
name: Pull Request CI
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
  build_and_test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # e2e.sh splits ALL_TESTS into balanced slices from the shard
        # number, so the test list lives only there: 3 runners cover the
        # whole suite (7 tests -> 3/2/2) and cutting wall time ~3x.
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - name: Print versions
        run: |
          git --version
          docker --version
      - name: Build image
        run: make build
      - name: Run e2e tests
        # This runner's slice of the suite, two tests at a time
        # (ZEK_E2E_JOBS default): the runner has 4 vCPU/16GB - more
        # parallel clusters risk OOM and kubeadm's hard 4m deadline.
        env:
          ZEK_E2E_SHARD: ${{ matrix.shard }}
        run: ./e2e.sh
