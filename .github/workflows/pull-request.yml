---
{
  name: "Pull Request CI",
  "on": {
    pull_request: {
      branches: [
        "main",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.event.pull_request.number }}",
    cancel-in-progress: true,
  },
  # Workflow-level defaults: pin bash for every run: block (on ubuntu
  # GitHub already runs `bash -eo pipefail`) and keep the default token
  # scope read-only (the shared CI workflow only checks out, lints and tests).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    ci: {
      uses: "./.github/workflows/ci.yml",
    },
  },
}
