---
name: Pull Request CI
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
  build_and_test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Print versions
        run: |
          git --version
          docker --version
      - name: Build image
        run: make build
      - name: Run e2e tests
        # No arguments: every test in e2e.sh's ALL_TESTS runs, two at a
        # time (ZEK_E2E_JOBS default): the runner has 4 vCPU/16GB - more
        # parallel clusters risk OOM and kubeadm's hard 4m deadline.
        run: ./e2e.sh
