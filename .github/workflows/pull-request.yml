---
{
  name: "Pull Request CI",
  "on": {
    pull_request: {
      branches: [
        "main",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.event.pull_request.number }}",
    cancel-in-progress: true,
  },
  # Workflow-level default: every run: block gets bash's -eo pipefail,
  # and the default token scope is read-only (both jobs only check out,
  # lint and test).
  permissions: {
    contents: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    lint: {
      uses: "./.github/workflows/lint.yml",
    },
    build_and_test: {
      needs: "lint",
      uses: "./.github/workflows/build-and-test.yml",
    },
  },
}
